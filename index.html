<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Jewellery Management</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 3h12l4 6-10 12L2 9z" />
              <path d="M2 9h20M12 21 8 9l4-6 4 6-4 12" />
            </svg>
          </span>
          <div>
            <p class="eyebrow">Jewellery Shop</p>
            <h1>Management Dashboard</h1>
          </div>
        </div>

        <nav class="topnav" aria-label="Sections">
          <a href="#inventory">Inventory</a>
          <a href="#sales">Sales</a>
          <a href="#customers">Customers</a>
        </nav>

        <div class="topbar-meta">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" />
          </svg>
          <span id="todayDate"></span>
        </div>
      </div>
    </header>

    <div class="app-shell">
      <main class="main-grid">
        <section class="stats-grid" aria-label="Business overview">
          <article class="stat-card accent-purple">
            <span class="stat-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 8 12 3 3 8v8l9 5 9-5z" />
                <path d="M3 8l9 5 9-5M12 13v8" />
              </svg>
            </span>
            <div class="stat-body">
              <span class="label">Inventory Value</span>
              <strong id="inventoryValue">₹0</strong>
            </div>
          </article>
          <article class="stat-card accent-gold">
            <span class="stat-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 17l6-6 4 4 8-8" />
                <path d="M14 7h7v7" />
              </svg>
            </span>
            <div class="stat-body">
              <span class="label">Monthly Sales</span>
              <strong id="monthlySales">₹0</strong>
            </div>
          </article>
          <article class="stat-card accent-blue">
            <span class="stat-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="8" r="4" />
                <path d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3" />
              </svg>
            </span>
            <div class="stat-body">
              <span class="label">Customers</span>
              <strong id="customerCount">0</strong>
            </div>
          </article>
          <article class="stat-card accent-rose">
            <span class="stat-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" />
                <path d="M12 9v4M12 17h.01" />
              </svg>
            </span>
            <div class="stat-body">
              <span class="label">Low Stock Items</span>
              <strong id="lowStockCount">0</strong>
            </div>
          </article>
        </section>

        <section class="panel" id="inventory" aria-labelledby="inventory-title">
          <div class="panel-header">
            <div>
              <p class="subhead">Catalog</p>
              <h2 id="inventory-title">Inventory <span class="count-pill" id="inventoryCountLabel"></span></h2>
            </div>
          </div>

          <form id="inventory-form" class="form-grid form-inventory">
            <label class="field field-wide">
              <span>Item name</span>
              <input type="text" name="name" placeholder="e.g. Diamond Ring" required />
            </label>
            <label class="field">
              <span>Category</span>
              <select name="category" required>
                <option value="">Select</option>
                <option value="Ring">Ring</option>
                <option value="Necklace">Necklace</option>
                <option value="Bracelet">Bracelet</option>
                <option value="Earrings">Earrings</option>
                <option value="Pendant">Pendant</option>
                <option value="Bangle">Bangle</option>
              </select>
            </label>
            <label class="field">
              <span>Purity</span>
              <input type="text" name="purity" placeholder="18K" value="18K" required />
            </label>
            <label class="field">
              <span>Weight (g)</span>
              <input type="number" name="weight" placeholder="0.00" min="0" step="0.01" required />
            </label>
            <label class="field">
              <span>Selling price (₹)</span>
              <input type="number" name="price" placeholder="0" min="0" step="0.01" required />
            </label>
            <label class="field">
              <span>Stock</span>
              <input type="number" name="stock" placeholder="0" min="0" step="1" required />
            </label>
            <div class="field field-action">
              <button type="submit" class="btn btn-primary">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
                Add item
              </button>
            </div>
          </form>

          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Category</th>
                  <th>Purity</th>
                  <th class="num">Weight</th>
                  <th class="num">Price</th>
                  <th class="num">Stock</th>
                  <th class="actions-col"><span class="visually-hidden">Action</span></th>
                </tr>
              </thead>
              <tbody id="inventoryTableBody"></tbody>
            </table>
          </div>
        </section>

        <div class="split-grid">
          <section class="panel" id="sales" aria-labelledby="sales-title">
            <div class="panel-header">
              <div>
                <p class="subhead">Transactions</p>
                <h2 id="sales-title">Recent Sales <span class="count-pill" id="salesCountLabel"></span></h2>
              </div>
            </div>

            <form id="sale-form" class="form-grid form-sale">
              <label class="field">
                <span>Customer</span>
                <select id="saleCustomer" name="customer" required>
                  <option value="">Customer</option>
                </select>
              </label>
              <label class="field">
                <span>Item</span>
                <select id="saleItem" name="item" required>
                  <option value="">Item</option>
                </select>
              </label>
              <label class="field">
                <span>Qty</span>
                <input type="number" name="quantity" placeholder="1" min="1" step="1" required />
              </label>
              <label class="field">
                <span>Amount (₹)</span>
                <input type="number" name="amount" placeholder="0" min="0" step="0.01" required />
              </label>
              <div class="field field-action">
                <button type="submit" class="btn btn-primary">Record sale</button>
              </div>
            </form>

            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Customer</th>
                    <th>Item</th>
                    <th class="num">Qty</th>
                    <th class="num">Amount</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody id="salesTableBody"></tbody>
              </table>
            </div>
          </section>

          <section class="panel" id="customers" aria-labelledby="customers-title">
            <div class="panel-header">
              <div>
                <p class="subhead">CRM</p>
                <h2 id="customers-title">Customers <span class="count-pill" id="customersCountLabel"></span></h2>
              </div>
            </div>

            <form id="customer-form" class="form-grid form-customer">
              <label class="field">
                <span>Name</span>
                <input type="text" name="name" placeholder="Customer name" required />
              </label>
              <label class="field">
                <span>Phone</span>
                <input type="tel" name="phone" placeholder="Phone" required />
              </label>
              <label class="field">
                <span>City</span>
                <input type="text" name="city" placeholder="City" required />
              </label>
              <div class="field field-action">
                <button type="submit" class="btn btn-primary">Add customer</button>
              </div>
            </form>

            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>City</th>
                  </tr>
                </thead>
                <tbody id="customersTableBody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
